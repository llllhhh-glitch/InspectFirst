# Docker DNS may return new addresses when backend containers are recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream identity_backend {
    zone identity_backend 64k;
    server identity:8087 resolve;
}
upstream guide_backend {
    zone guide_backend 64k;
    server guide:8086 resolve;
}
upstream inspection_backend {
    zone inspection_backend 64k;
    server inspection:8088 resolve;
}
upstream report_backend {
    zone report_backend 64k;
    server report:8089 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/auth { proxy_pass http://identity_backend; }
    location /api/ops/content { proxy_pass http://guide_backend; }
    location /api/ops/feedback { proxy_pass http://guide_backend; }
    location /api/ops/users { proxy_pass http://identity_backend; }
    location /api/ops/inspections { proxy_pass http://inspection_backend; }
    location /api/ops/reports { proxy_pass http://report_backend; }
    location /api/inspections { proxy_pass http://inspection_backend; }
    location /api/attachments { proxy_pass http://inspection_backend; }
    location /api/reports { proxy_pass http://report_backend; }
    location /api/ { proxy_pass http://guide_backend; }
    location / { try_files $uri $uri/ /index.html; }
}
