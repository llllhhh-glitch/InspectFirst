name: inspectfirst
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 deploy/configure.py}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Configure .env}
      GUIDE_DB_PASSWORD: ${GUIDE_DB_PASSWORD:?Configure .env}
      INSPECTION_DB_PASSWORD: ${INSPECTION_DB_PASSWORD:?Configure .env}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?Configure .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./deploy/mysql/05-catalogue.sql:/docker-entrypoint-initdb.d/05-catalogue.sql:ro
      - ./deploy/mysql/10-create-users.sh:/docker-entrypoint-initdb.d/10-create-users.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 8388608
      KAFKA_REPLICA_FETCH_MAX_BYTES: 8388608
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
  identity:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: identity-service
    environment:
      SERVER_ADDRESS: 0.0.0.0
      IDENTITY_DB_URL: jdbc:mysql://mysql:3306/identity_db?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      IDENTITY_DB_USER: inspectfirst_identity
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Configure .env}
      SERVICES_IDENTITY: http://identity:8087
      SERVICES_GUIDE: http://guide:8086
      SERVICES_INSPECTION: http://inspection:8088
      KAFKA_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8087/api/auth/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  guide:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: guide-service
    environment:
      SERVER_ADDRESS: 0.0.0.0
      GUIDE_DB_URL: jdbc:mysql://mysql:3306/check_guide_db?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      GUIDE_DB_USER: inspectfirst_guide
      GUIDE_DB_PASSWORD: ${GUIDE_DB_PASSWORD:?Configure .env}
      SERVICES_IDENTITY: http://identity:8087
      SERVICES_GUIDE: http://guide:8086
      SERVICES_INSPECTION: http://inspection:8088
      KAFKA_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8086/api/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  inspection:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: inspection-service
    environment:
      SERVER_ADDRESS: 0.0.0.0
      INSPECTION_DB_URL: jdbc:mysql://mysql:3306/inspection_db?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      INSPECTION_DB_USER: inspectfirst_inspection
      INSPECTION_DB_PASSWORD: ${INSPECTION_DB_PASSWORD:?Configure .env}
      SERVICES_IDENTITY: http://identity:8087
      SERVICES_GUIDE: http://guide:8086
      SERVICES_INSPECTION: http://inspection:8088
      KAFKA_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
      INSPECTFIRST_ATTACHMENTS: /data/attachments
    volumes:
      - attachment-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
      guide:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8088/api/inspections/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  report:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: report-service
    environment:
      SERVER_ADDRESS: 0.0.0.0
      REPORT_DB_URL: jdbc:mysql://mysql:3306/report_db?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      REPORT_DB_USER: inspectfirst_report
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?Configure .env}
      SERVICES_IDENTITY: http://identity:8087
      SERVICES_GUIDE: http://guide:8086
      SERVICES_INSPECTION: http://inspection:8088
      KAFKA_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8089/api/reports/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      identity:
        condition: service_healthy
      guide:
        condition: service_healthy
      inspection:
        condition: service_healthy
      report:
        condition: service_healthy
    healthcheck:
      test: [CMD, sh, /usr/local/bin/inspectfirst-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
  kafka-data:
  attachment-data:
